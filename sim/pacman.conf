# Simulation-only pacman config.
# Deliberately has no Arch mirrors: scenarios run with --network none and every
# package must come from the local file:// repo. If a test needs real Arch
# packages, add them to sim/make-repo.sh instead of opening the network.
[options]
RootDir            = /
DBPath             = /var/lib/pacman/
CacheDir           = /var/cache/pacman/pkg/
LogFile            = /var/log/pacman.log
GPGDir             = /etc/pacman.d/gnupg/
HookDir            = /etc/pacman.d/hooks/
HoldPkg            = pacman glibc
Architecture       = x86_64
SigLevel           = Never
LocalFileSigLevel  = Never
ParallelDownloads  = 5

[sim]
SigLevel = Never
Server = file:///srv/simrepo
