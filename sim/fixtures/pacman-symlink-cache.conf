# Simulation-only pacman config for the symlinked CacheDir scenario.
# Same as sim/pacman.conf except the cache lives behind /tmp/cache-link.
[options]
RootDir            = /
DBPath             = /var/lib/pacman/
CacheDir           = /tmp/cache-link/
LogFile            = /var/log/pacman.log
GPGDir             = /etc/pacman.d/gnupg/
HookDir            = /etc/pacman.d/hooks/
HoldPkg            = pacman glibc
Architecture       = x86_64
SigLevel           = Never
LocalFileSigLevel  = Never
ParallelDownloads  = 5

[sim]
SigLevel = Never
Server = file:///srv/simrepo
Include = /etc/pacman.d/aurto
