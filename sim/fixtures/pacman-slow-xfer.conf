# Simulation-only pacman config with a slow local transfer.
#
# Identical to sim/pacman.conf plus an XferCommand that writes the `.part` in
# two chunks. Only scenario 34 copies this over /etc/pacman.conf; every other
# scenario keeps the normal fast local copy.
[options]
RootDir            = /
DBPath             = /var/lib/pacman/
CacheDir           = /var/cache/pacman/pkg/
LogFile            = /var/log/pacman.log
GPGDir             = /etc/pacman.d/gnupg/
HookDir            = /etc/pacman.d/hooks/
HoldPkg            = pacman glibc
Architecture       = x86_64
SigLevel           = Never
LocalFileSigLevel  = Never
ParallelDownloads  = 1
XferCommand        = /usr/local/lib/sim/fixtures/sim-xfer %u %o

[sim]
SigLevel = Never
Server = file:///srv/simrepo
